<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQ | Super Admin Control Tower</title>
    <style>
        :root {
            --primary-red: #E53935;
            --dark-blue: #0D1B2A;
            --deep-space: #050a0f;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-glow: 0 0 15px rgba(229, 57, 53, 0.5);
            --text-gray: #b0b3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--deep-space);
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        /* --- UTILITIES --- */
        .flex { display: flex; }
        .hidden { display: none !important; }
        .animate-fade { animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .blink { animation: pulse 1.5s infinite; }

        /* --- LOGIN PAGE --- */
        #login-page {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1b263b 0%, #0d1b2a 100%);
        }

        .login-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        .login-card h1 { color: var(--primary-red); margin-bottom: 10px; letter-spacing: 2px; }
        .login-card p { color: var(--text-gray); font-size: 0.9rem; margin-bottom: 30px; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; color: var(--text-gray); font-size: 0.8rem; margin-bottom: 5px; }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus { border-color: var(--primary-red); box-shadow: var(--neon-glow); }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--primary-red);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-login:hover { transform: scale(1.02); filter: brightness(1.2); }

        .demo-creds { margin-top: 30px; font-size: 0.75rem; color: #555; border-top: 1px solid var(--glass-border); pt: 15px; }
        .help-link { color: var(--primary-red); cursor: pointer; text-decoration: underline; margin-top: 15px; display: inline-block; }

        /* --- DASHBOARD LAYOUT --- */
        #main-dashboard {
            display: grid;
            grid-template-columns: 260px 1fr;
            height: 100vh;
        }

        /* Sidebar */
        aside {
            background: var(--dark-blue);
            border-right: 1px solid var(--glass-border);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .nav-item {
            padding: 12px 15px;
            margin-bottom: 5px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-gray);
            transition: 0.3s;
            display: flex;
            align-items: center;
            font-size: 0.9rem;
        }
        .nav-item:hover, .nav-item.active { background: var(--glass); color: white; border-left: 3px solid var(--primary-red); }
        .nav-item i { margin-right: 10px; width: 20px; }

        /* Header */
        header {
            height: 70px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: rgba(13, 27, 42, 0.8);
            backdrop-filter: blur(10px);
        }

        .status-badge {
            background: rgba(0, 255, 127, 0.1);
            color: #00ff7f;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            border: 1px solid rgba(0, 255, 127, 0.3);
        }

        /* Main Content */
        main {
            padding: 25px;
            overflow-y: auto;
            background: radial-gradient(circle at top right, #0f172a, #050a0f);
        }

        .grid-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--glass);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            position: relative;
            overflow: hidden;
        }
        .stat-card h3 { font-size: 0.8rem; color: var(--text-gray); text-transform: uppercase; letter-spacing: 1px; }
        .stat-card .value { font-size: 2rem; font-weight: bold; margin: 10px 0; color: white; }
        .stat-card .trend { font-size: 0.75rem; color: #00ff7f; }

        /* Map Simulation */
        .map-container {
            height: 400px;
            background: #0a0f18;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            position: relative;
            margin-bottom: 25px;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .map-marker {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--primary-red);
            border-radius: 50%;
            box-shadow: var(--neon-glow);
            transition: all 2s linear;
        }

        .map-label {
            position: absolute;
            font-size: 10px;
            color: var(--text-gray);
            pointer-events: none;
        }

        /* Tables & Lists */
        .content-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .panel {
            background: var(--glass);
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            padding: 20px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
        }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 0.8rem; color: var(--text-gray); padding: 10px; }
        td { padding: 12px 10px; font-size: 0.85rem; border-bottom: 1px solid var(--glass-border); }

        .btn-action {
            padding: 5px 10px;
            border-radius: 5px;
            border: none;
            font-size: 0.7rem;
            cursor: pointer;
            margin-right: 5px;
        }
        .btn-approve { background: rgba(0, 255, 127, 0.2); color: #00ff7f; }
        .btn-block { background: rgba(229, 57, 53, 0.2); color: var(--primary-red); }

        /* Notification Toast */
        #notification-box {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        .toast {
            background: var(--dark-blue);
            border-left: 4px solid var(--primary-red);
            padding: 15px 25px;
            border-radius: 5px;
            margin-bottom: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

    </style>
</head>
<body>

    <div id="login-page">
        <div class="login-card animate-fade">
            <h1 id="brand-logo">ResQ</h1>
            <p>COMMAND CENTER ACCESS</p>
            
            <div id="login-error" class="hidden" style="color: var(--primary-red); font-size: 0.8rem; margin-bottom: 15px;"></div>

            <div class="input-group">
                <label>ADMIN IDENTIFIER</label>
                <input type="text" id="admin-user" placeholder="Enter username">
            </div>
            <div class="input-group">
                <label>SECURITY KEY</label>
                <input type="password" id="admin-pass" placeholder="••••••••">
            </div>

            <button class="btn-login" onclick="attemptLogin()">AUTHENTICATE</button>
            
            <span class="help-link" onclick="alert('Contacting Support: 8978257449')">Need Assistance?</span>

            <div class="demo-creds">
                DEMO ACCESS: <strong>admin</strong> / <strong>resq2026</strong>
            </div>
        </div>
    </div>

    <div id="main-dashboard" class="hidden">
        <aside>
            <h2 style="color: var(--primary-red); margin-bottom: 30px; letter-spacing: 2px;">ResQ</h2>
            <div class="nav-item active" onclick="switchTab('global')">🌐 Global Dashboard</div>
            <div class="nav-item" onclick="switchTab('hospitals')">🏥 Hospital Network</div>
            <div class="nav-item" onclick="switchTab('fleet')">🚑 Ambulance Fleet</div>
            <div class="nav-item" onclick="switchTab('analytics')">📊 Advanced Analytics</div>
            <div class="nav-item" onclick="switchTab('finance')">💰 Revenue & Commission</div>
            <div class="nav-item" onclick="switchTab('alerts')">⚠️ Emergency Alerts</div>
            
            <div style="margin-top: auto;">
                <div class="nav-item" style="opacity: 0.5;">⚙️ System Settings</div>
                <div class="nav-item" onclick="location.reload()" style="color: var(--primary-red);">🔒 Logout</div>
            </div>
        </aside>

        <section style="flex: 1; display: flex; flex-direction: column;">
            <header>
                <div class="flex" style="align-items: center;">
                    <span style="margin-right: 20px; font-weight: bold;" id="header-title">CONTROL TOWER</span>
                    <span class="status-badge"><span class="blink">●</span> SYSTEM ONLINE</span>
                </div>
                <div class="flex" style="align-items: center; gap: 20px;">
                    <div id="server-time" style="font-family: monospace; color: var(--text-gray);">18:12:02</div>
                    <div style="font-size: 0.8rem;">Welcome, <strong>Super Admin</strong></div>
                </div>
            </header>

            <main id="dashboard-content">
                </main>
        </section>
    </div>

    <div id="notification-box"></div>

    <script>
        // --- DATA & STATE ---
        const HOSPITALS = [
            { id: 1, name: "Omni Hospitals", area: "Kukataplly", response: "4.2m", rating: 4.8, status: "Active", amb: 12 },
            { id: 2, name: "Anupama Hospital", area: "KPHB", response: "5.1m", rating: 4.5, status: "Active", amb: 8 },
            { id: 3, name: "Prime Hospital", area: "Miyapur", response: "6.8m", rating: 4.2, status: "Busy", amb: 5 },
            { id: 4, name: "Pranaam Hospital", area: "JNTU", response: "3.9m", rating: 4.9, status: "Active", amb: 15 },
            { id: 5, name: "Remedy Care", area: "Pragathi Nagar", response: "7.2m", rating: 4.0, status: "Active", amb: 6 }
        ];

        let stats = {
            emergencies: 42,
            hospitals: 128,
            fleet: 450,
            revenue: 842500
        };

        // --- AUTH LOGIC ---
        function attemptLogin() {
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;
            const errorDiv = document.getElementById('login-error');

            if (!user || !pass) {
                errorDiv.innerText = "Please enter all fields.";
                errorDiv.classList.remove('hidden');
                return;
            }

            if (user === "admin" && pass === "resq2026") {
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('main-dashboard').classList.remove('hidden');
                renderDashboard('global');
                startLiveUpdates();
            } else {
                errorDiv.innerText = "Invalid security credentials.";
                errorDiv.classList.remove('hidden');
                document.querySelector('.login-card').style.animation = "shake 0.4s";
                setTimeout(() => document.querySelector('.login-card').style.animation = "", 400);
            }
        }

        // --- NAVIGATION ---
        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderDashboard(tab);
        }

        function renderDashboard(view) {
            const container = document.getElementById('dashboard-content');
            container.innerHTML = '';
            
            if (view === 'global') {
                container.innerHTML = `
                    <div class="grid-stats animate-fade">
                        <div class="stat-card"><h3>Active Emergencies</h3><div class="value" id="stat-em">${stats.emergencies}</div><div class="trend">↑ 12% from last hour</div></div>
                        <div class="stat-card"><h3>Live Fleet</h3><div class="value" id="stat-fleet">${stats.fleet}</div><div class="trend">98% Deployment</div></div>
                        <div class="stat-card"><h3>Hospital Partners</h3><div class="value">${stats.hospitals}</div><div class="trend">5 Pending Approval</div></div>
                        <div class="stat-card"><h3>Est. Revenue</h3><div class="value" id="stat-rev">₹${stats.revenue.toLocaleString()}</div><div class="trend" style="color:var(--primary-red)">Commission: 15%</div></div>
                    </div>

                    <div class="panel animate-fade" style="margin-bottom:25px;">
                        <div class="panel-header"><h3>City Wide Heatmap Simulation (Hyderabad)</h3><span style="font-size:0.7rem; color:var(--text-gray)">Live GPS Monitoring</span></div>
                        <div class="map-container" id="map-sim">
                            <div class="map-label" style="top:50px; left:100px;">KPHB COLONY</div>
                            <div class="map-label" style="top:250px; left:400px;">MIYAPUR</div>
                            <div class="map-label" style="top:150px; left:600px;">JNTU</div>
                            <div class="map-label" style="top:320px; left:150px;">KUKATPALLY</div>
                        </div>
                    </div>

                    <div class="content-row animate-fade">
                        <div class="panel">
                            <div class="panel-header"><h3>Emergency Feed</h3><button class="btn-action btn-approve">View All</button></div>
                            <table>
                                <thead><tr><th>Time</th><th>Patient Area</th><th>Hospital</th><th>Status</th></tr></thead>
                                <tbody id="emergency-table">
                                    <tr><td>Just Now</td><td>KPHB Phase 3</td><td>Omni Hospital</td><td><span style="color:#00ff7f">Assigned</span></td></tr>
                                    <tr><td>2m ago</td><td>JNTU Metro</td><td>Pranaam Hospital</td><td><span style="color:#00ff7f">En-Route</span></td></tr>
                                    <tr style="background:rgba(229,57,53,0.1)"><td>5m ago</td><td>Miyapur X Road</td><td>-</td><td><span style="color:var(--primary-red)">Searching...</span></td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="panel">
                             <div class="panel-header"><h3>AI Demand Prediction</h3></div>
                             <div style="font-size:0.85rem; line-height:1.6">
                                <p style="color:#00ff7f; margin-bottom:10px;">● High Demand Expected: JNTU Area (18:00 - 20:00)</p>
                                <p style="color:var(--text-gray)">● Recommendation: Move 3 ambulances from Kukatpally to Miyapur buffer zone.</p>
                             </div>
                        </div>
                    </div>
                `;
                initMapMarkers();
            } else if (view === 'hospitals') {
                container.innerHTML = `
                    <div class="panel animate-fade">
                        <div class="panel-header"><h3>Hospital Network Management</h3></div>
                        <table>
                            <thead><tr><th>Name</th><th>Location</th><th>Response Time</th><th>Rating</th><th>Status</th><th>Actions</th></tr></thead>
                            <tbody>
                                ${HOSPITALS.map(h => `
                                    <tr>
                                        <td><strong>${h.name}</strong></td>
                                        <td>${h.area}</td>
                                        <td>${h.response}</td>
                                        <td>⭐ ${h.rating}</td>
                                        <td><span class="status-badge" style="color: ${h.status === 'Active' ? '#00ff7f' : '#ffb100'}">${h.status}</span></td>
                                        <td>
                                            <button class="btn-action btn-approve">Edit</button>
                                            <button class="btn-action btn-block">Block</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else {
                container.innerHTML = `<div class="panel animate-fade" style="text-align:center; padding:100px;"><h3>Module Under Maintenance</h3><p style="color:var(--text-gray)">Section "${view}" is being synced with real-time servers.</p></div>`;
            }
        }

        // --- SIMULATION ENGINES ---
        function initMapMarkers() {
            const map = document.getElementById('map-sim');
            if(!map) return;
            for(let i=0; i<8; i++) {
                const marker = document.createElement('div');
                marker.className = 'map-marker';
                marker.style.top = Math.random() * 90 + '%';
                marker.style.left = Math.random() * 90 + '%';
                map.appendChild(marker);
                
                setInterval(() => {
                    marker.style.top = Math.random() * 90 + '%';
                    marker.style.left = Math.random() * 90 + '%';
                }, 4000 + (Math.random() * 2000));
            }
        }

        function startLiveUpdates() {
            setInterval(() => {
                // Update stats
                stats.emergencies += Math.floor(Math.random() * 3) - 1;
                stats.revenue += Math.floor(Math.random() * 500);
                
                const emEl = document.getElementById('stat-em');
                const revEl = document.getElementById('stat-rev');
                
                if(emEl) emEl.innerText = stats.emergencies;
                if(revEl) revEl.innerText = "₹" + stats.revenue.toLocaleString();

                // Server Time
                document.getElementById('server-time').innerText = new Date().toLocaleTimeString();

                // Random Toast
                if(Math.random() > 0.8) {
                    showToast("New Emergency Reported: Pragathi Nagar");
                }
            }, 3000);
        }

        function showToast(msg) {
            const box = document.getElementById('notification-box');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<strong>ALERT:</strong> ${msg}`;
            box.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

    </script>
</body>
</html>
