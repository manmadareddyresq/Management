<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResQ Super Admin Control</title>

<style>
body{
  margin:0;
  font-family:Inter, sans-serif;
  background:#020617;
  color:#fff;
}

/* SIDEBAR */
.sidebar{
  position:fixed;
  width:240px;
  height:100%;
  background:#020617;
  padding:15px;
}
.nav-item{
  padding:10px;
  margin:5px 0;
  cursor:pointer;
  border-radius:8px;
  color:#9ca3af;
}
.nav-item:hover,.active{
  background:#111827;
  color:#fff;
}

/* MAIN */
.main{
  margin-left:250px;
  padding:15px;
}

/* MOBILE */
@media(max-width:800px){
  .sidebar{
    position:relative;
    width:100%;
    display:flex;
    flex-wrap:wrap;
  }
  .main{
    margin-left:0;
  }
}

/* CARDS */
.card{
  background:#111827;
  padding:12px;
  border-radius:10px;
  margin-bottom:12px;
  box-shadow:0 0 10px rgba(0,0,0,0.4);
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:8px;
  text-align:left;
}
tr:nth-child(even){
  background:#0f172a;
}

/* SEARCH */
input{
  padding:8px;
  border-radius:8px;
  border:none;
  width:100%;
  margin-bottom:10px;
}

/* MAP */
.map{
  height:250px;
  background:linear-gradient(#0f172a,#020617);
  position:relative;
  overflow:hidden;
}
.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  position:absolute;
  background:#22c55e;
  animation:move 6s infinite linear;
}
@keyframes move{
  from{transform:translate(0,0)}
  to{transform:translate(100px,80px)}
}

/* NOTIFICATION */
.toast{
  position:fixed;
  top:10px;
  right:10px;
  background:#22c55e;
  padding:10px;
  border-radius:8px;
  display:none;
}
</style>
</head>

<body>

<div class="sidebar">
<h3>ResQ</h3>
<div class="nav-item active" onclick="show('dash')">Dashboard</div>
<div class="nav-item" onclick="show('users')">Users</div>
<div class="nav-item" onclick="show('drivers')">Drivers</div>
<div class="nav-item" onclick="show('finance')">Finance</div>
<div class="nav-item" onclick="show('map')">Live Map</div>
<div class="nav-item" onclick="show('admins')">Admins</div>
</div>

<div class="main">

<h2 id="title">Dashboard</h2>

<!-- DASHBOARD -->
<div id="dash" class="page">
<div class="card">
Active Emergencies: <b id="emg"></b><br>
Revenue Today: ₹<b id="rev"></b><br>
Commission: ₹<b id="com"></b>
</div>
</div>

<!-- USERS -->
<div id="users" class="page" style="display:none;">
<input id="searchUser" placeholder="Search users..." oninput="renderUsers()">
<table id="userTable"></table>
</div>

<!-- DRIVERS -->
<div id="drivers" class="page" style="display:none;">
<table id="driverTable"></table>
</div>

<!-- FINANCE -->
<div id="finance" class="page" style="display:none;">
<div class="card">
Last Ride: ₹<span id="lastRide"></span><br>
Hospital Payment: <span id="payment"></span>
</div>
</div>

<!-- MAP -->
<div id="map" class="page" style="display:none;">
<div class="map" id="mapArea"></div>
</div>

<!-- ADMINS -->
<div id="admins" class="page" style="display:none;">
<table id="adminTable"></table>
</div>

</div>

<div class="toast" id="toast">New Emergency Assigned 🚑</div>

<script>

// RANDOM
function r(min,max){return Math.floor(Math.random()*(max-min+1))+min}

// DASHBOARD LIVE
function updateDash(){
 document.getElementById("emg").innerText=r(3,12);
 document.getElementById("rev").innerText=r(100,900);
 document.getElementById("com").innerText=r(20,150);
 document.getElementById("lastRide").innerText=r(120,400);
 document.getElementById("payment").innerText=Math.random()>0.5?"Received":"Pending";
}
setInterval(updateDash,2000); updateDash();

// USERS DATA
function randomName(){
 const n=["Rahul","Anil","Priya","Sai","Kiran","Manmada","Vivek"];
 return n[r(0,n.length-1)];
}
function renderUsers(){
 let q=document.getElementById("searchUser").value.toLowerCase();
 let html="<tr><th>Name</th><th>Phone</th><th>Area</th></tr>";
 for(let i=0;i<8;i++){
  let name=randomName();
  if(name.toLowerCase().includes(q)){
   html+=`<tr><td>${name}</td><td>9${r(100000000,999999999)}</td><td>KPHB</td></tr>`;
  }
 }
 document.getElementById("userTable").innerHTML=html;
}
renderUsers();

// DRIVERS
function renderDrivers(){
 let html="<tr><th>Name</th><th>Status</th><th>Earnings</th></tr>";
 for(let i=0;i<6;i++){
  html+=`<tr><td>Driver ${i}</td><td>${Math.random()>0.5?"Online":"Offline"}</td><td>₹${r(200,900)}</td></tr>`;
 }
 document.getElementById("driverTable").innerHTML=html;
}
renderDrivers();

// ADMINS
function renderAdmins(){
 let html="<tr><th>Name</th><th>Status</th></tr>";
 for(let i=0;i<4;i++){
  html+=`<tr><td>Admin ${i}</td><td>${Math.random()>0.5?"Online":"Offline"}</td></tr>`;
 }
 document.getElementById("adminTable").innerHTML=html;
}
renderAdmins();

// MAP
function createMap(){
 let map=document.getElementById("mapArea");
 for(let i=0;i<5;i++){
  let d=document.createElement("div");
  d.className="dot";
  d.style.top=r(0,200)+"px";
  d.style.left=r(0,200)+"px";
  map.appendChild(d);
 }
}
createMap();

// NAVIGATION
function show(p){
 document.querySelectorAll(".page").forEach(el=>el.style.display="none");
 document.getElementById(p).style.display="block";
 document.getElementById("title").innerText=p.toUpperCase();
}

// NOTIFICATION
setInterval(()=>{
 let t=document.getElementById("toast");
 t.style.display="block";
 setTimeout(()=>t.style.display="none",2000);
},6000);

</script>

</body>
</html>
